name: CI

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: 'Build Website'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-dependencies-v1-${{ hashFiles('package.json') }}
      - name: Load site cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site
          key: ${{ runner.os }}-site-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - name: Install fonts
        run: |
          sudo apt update
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install ttf-mscorefonts-installer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installing Dependencies
        run: |
          npm install
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run clean
          npm run build

  build_documentation:
    needs: build
    name: 'Build Documentation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-dependencies-v1-${{ hashFiles('package.json') }}
      - name: Load site cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site
          key: ${{ runner.os }}-site-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - name: Load documentation cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site/docs
          key: ${{ runner.os }}-site-docs-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:docs
      
  build_terms:
    needs: build
    name: 'Build Terminologies'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-dependencies-v1-${{ hashFiles('package.json') }}
      - name: Load site cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site
          key: ${{ runner.os }}-site-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - name: Load terms cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site/terms
          key: ${{ runner.os }}-site-terms-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build terminologies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:procedures

  deploy_netlify:
    needs:
      - build
      - build_documentation
      - build_terms
    name: 'Deploy to Netlify'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Load dependecy cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-dependencies-v1-${{ hashFiles('package.json') }}
      - name: Load site cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site
          key: ${{ runner.os }}-site-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - name: Load documentation cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site/docs
          key: ${{ runner.os }}-site-docs-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - name: Load terms cache
        uses: actions/cache@v4
        with:
          path: |
            **/_site/terms
          key: ${{ runner.os }}-site-terms-v1-${{ hashFiles('package.json') }}-${{ github.run_number }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm run deploy
      - name: Status check
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: Netlify preview
          state: success
          target_url: https://openhps.org/